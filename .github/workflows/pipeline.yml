name: Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: 'Verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Marketplace manifest check
        run: npm run marketplace:check

      - name: Plugin manifests check
        run: npm run plugins:check

      - name: Script test check
        run: npm test
